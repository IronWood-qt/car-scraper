name: 🚗 Daily Car Scraper

# DISABLED by default (no `schedule:` trigger) - project direction is a
# self-hosted deployment (docker-compose, see README/dashboard/), so scraped
# data and search criteria stay entirely on your own box and never touch
# GitHub. Kept here, manual-dispatch-only, for an ad-hoc one-off CI run if
# you ever want one - note it starts from zero history every time (data/
# isn't persisted in CI), so "new listing" alerts will fire for everything
# found, every run.
on:
  workflow_dispatch:

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write    # open/append car-alert issues

    steps:
    - name: 🔄 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: false

    - name: 🔄 Install dependencies
      run: poetry install --no-interaction --no-ansi

    # targets.json is gitignored (which cars you track is private, not
    # project config - see .gitignore / README) so checkout never has it.
    # Materialize it here from a repo secret instead. This fresh runner has
    # no targets.db either - main.py's first SettingsStore/open_default_store
    # call auto-imports targets.json into a fresh targets.db right here.
    - name: 🔐 Write targets.json from secret
      env:
        TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
      run: |
        if [ -z "$TARGETS_JSON" ]; then
          echo "::error::TARGETS_JSON secret is not set - see README for setup"
          exit 1
        fi
        printf '%s' "$TARGETS_JSON" > targets.json
        python -c "import json; json.load(open('targets.json'))"  # fail fast on bad JSON

    - name: 🔍 Scrape all targets
      env:
        PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        # DASHBOARD_URL: set this repo var/secret if you want the Pushover
        # push to link somewhere (e.g. your self-hosted dashboard's URL).
        DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      run: poetry run python main.py

    - name: 🔔 Alert on new cars / price drops
      if: ${{ hashFiles('data/alerts.md') != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Only act on a non-empty alerts file.
        [ -s data/alerts.md ] || { echo "alerts.md empty, skipping"; exit 0; }
        title="🚗 Car alerts"
        gh label create car-alert --color FF6B6B \
          --description "New car / price-drop alerts" 2>/dev/null || true
        # Reuse one rolling issue. Search by plain text, match exact title via jq.
        num=$(gh issue list --state open --search "Car alerts in:title" \
              --json number,title -q ".[] | select(.title==\"$title\") | .number" | head -1)
        if [ -n "$num" ]; then
          gh issue comment "$num" --body-file data/alerts.md
        else
          gh issue create --title "$title" --label car-alert --body-file data/alerts.md
        fi
