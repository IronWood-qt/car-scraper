name: 🌐 Redeploy dashboard to Pages

# Manual fallback: rebuilds plots/ from the data/ already committed on main
# and redeploys it to Pages. The daily-scrape workflow does this same
# build-and-deploy automatically after every scrape, so this is only needed
# to force a redeploy without waiting for (or triggering) a new scrape - e.g.
# after changing report_template.html or the Pages site settings.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: false

      - name: 🔄 Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: 📊 Generate PNG plots + static dashboard
        run: |
          for key in $(python -c "import json;print(' '.join(t['key'] for t in json.load(open('targets.json'))['targets']))"); do
            echo "Plotting $key"
            poetry run python main.py plot --model "$key" --plot-type all || true
          done
          poetry run python main.py report

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload plots/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: plots

      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
