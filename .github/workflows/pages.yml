name: 🌐 Redeploy dashboard to Pages

# Legacy / manual-only: project direction is a self-hosted dashboard
# (docker-compose, see README/dashboard/), so data/ is gitignored now and a
# fresh CI checkout has none - this produces an empty dashboard unless
# daily-scrape.yml's manual run just populated data/ earlier in the same
# job (it doesn't persist between separate workflow runs either). Kept for
# reference; the self-hosted app is the real deployment path.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: false

      - name: 🔄 Install dependencies
        run: poetry install --no-interaction --no-ansi

      # targets.json is gitignored (private, not project config) - see README.
      - name: 🔐 Write targets.json from secret
        env:
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
        run: |
          if [ -z "$TARGETS_JSON" ]; then
            echo "::error::TARGETS_JSON secret is not set - see README for setup"
            exit 1
          fi
          printf '%s' "$TARGETS_JSON" > targets.json
          python -c "import json; json.load(open('targets.json'))"

      - name: 📊 Generate PNG plots + static dashboard
        run: |
          for key in $(python -c "import json;print(' '.join(t['key'] for t in json.load(open('targets.json'))['targets']))"); do
            echo "Plotting $key"
            poetry run python main.py plot --model "$key" --plot-type all || true
          done
          poetry run python main.py report

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload plots/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: plots

      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
